name: SmartScan Pro - Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write lets the job publish each successful APK as a GitHub
# Release, so there is always a direct download link (Releases page) that
# does not expire like Actions artifacts do.
permissions:
  contents: write

concurrency:
  group: smartscan-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version from run number
        run: |
          echo "VERSION_CODE=$((300 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=3.${GITHUB_RUN_NUMBER}.0" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testFossDebugUnitTest --stacktrace --console=plain

      # Release = R8-optimized and non-debuggable: much smoother UI and a
      # smaller file than a debug build. Signed with the same key as before.
      - name: Build APK
        run: ./gradlew :app:assembleFossRelease :app:assemblePlayRelease --stacktrace --console=plain

      - name: Prepare APK
        run: |
          APK=app/build/outputs/apk/foss/release/app-foss-release.apk
          test -s "$APK"
          cp "$APK" "SmartScan-Pro-v${VERSION_NAME}.apk"
          cp "$APK" SmartScan-Pro.apk
          sha256sum SmartScan-Pro.apk > SmartScan-Pro.apk.sha256
          GAPK=app/build/outputs/apk/play/release/app-play-release.apk
          test -s "$GAPK"
          cp "$GAPK" "SmartScan-Google-v${VERSION_NAME}.apk"

      - name: Verify APK (signature, version, size)
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --print-certs SmartScan-Pro.apk | tee apk-verify.txt
          "$BT/aapt2" dump badging SmartScan-Pro.apk | grep -E "^package:|^application-label:|native-code" | tee -a apk-verify.txt
          ls -l SmartScan-Pro.apk | tee -a apk-verify.txt
          grep -q "versionCode='${VERSION_CODE}'" apk-verify.txt

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartScan-Pro-APK
          path: |
            SmartScan-Pro.apk
            SmartScan-Pro.apk.sha256
            apk-verify.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" \
            "SmartScan-Pro-v${VERSION_NAME}.apk" "SmartScan-Google-v${VERSION_NAME}.apk" SmartScan-Pro.apk.sha256 \
            --title "SmartScan Pro v${VERSION_NAME}" \
            --notes "Automatic build from ${GITHUB_SHA::7}. Download SmartScan-Pro-v${VERSION_NAME}.apk and install it on Android. Installs as an update over earlier builds (same signing key)." \
            --latest
