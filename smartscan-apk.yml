name: SmartScan Pro - Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Build unsigned-in-production but installable debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleFossDebug --no-daemon --stacktrace --console=plain

      - name: Collect APK
        run: |
          test -s app/build/outputs/apk/foss/debug/app-foss-debug.apk
          cp app/build/outputs/apk/foss/debug/app-foss-debug.apk SmartScan-Pro.apk
          sha256sum SmartScan-Pro.apk > SmartScan-Pro.apk.sha256

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: SmartScan-Pro-APK
          path: |
            SmartScan-Pro.apk
            SmartScan-Pro.apk.sha256
          retention-days: 30
          if-no-files-found: error
